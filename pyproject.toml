readme = "README.md"
authors = [
    { name = "Bhavya", email = "ankursinghtomar2606@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openai>=1.40",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pypdf>=4.3",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "pytigergraph>=1.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.4",
    "tigergraph-mcp>=0.1",
    "tiktoken>=0.7",
